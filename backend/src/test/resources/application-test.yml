spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  flyway:
    enabled: false

app:
  jwt:
    public-key-path: classpath:keys/jwt-public.pem
    private-key-path: classpath:keys/jwt-private.pem
  encryption:
    key: "TestEncryptionKey2024ABCDEFGHIJ!"
  hmac:
    key: "TestHmacKey1234567890123456789012"
  storage:
    base-dir: ./test-uploads

logging:
  level:
    com.templeregistry: WARN
    org.springframework.security: WARN
