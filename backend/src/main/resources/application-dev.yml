spring:
  datasource:
    url: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:3Nkwm2fKtuGqoiu.root}
    password: ${DB_PASSWORD:6sXYNlDhrX80xnDz}
    hikari:
      connection-timeout: 20000
      connection-test-query: SELECT 1
      idle-timeout: 240000
      max-lifetime: 540000
      keepalive-time: 120000
      minimum-idle: 2
      maximum-pool-size: 8

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    validate-on-migrate: false
    repair-on-migrate: true

  security:
    debug: false

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

trm:
  export:
    base-dir: ./exports

app:
  jwt:
    private-key-path: classpath:keys/jwt-private.pem
    public-key-path: classpath:keys/jwt-public.pem
    access-token-expiry-ms: 18000000  # 5 hours (5 * 60 * 60 * 1000 ms)
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  encryption:
    key: "TempleRegistryDevelopmentKey2024"
  hmac:
    key: "TempleRegistryHmacKey2024!!CHANGE"
  storage:
    base-dir: ./uploads

logging:
  level:
    com.templeregistry: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
