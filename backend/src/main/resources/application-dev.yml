    url: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:3Nkwm2fKtuGqoiu.root}
    password: ${DB_PASSWORD:6sXYNlDhrX80xnDz}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    validate-on-migrate: false
    repair-on-migrate: true

  security:
