spring:
  datasource:
    url: jdbc:mysql://localhost:3306/temple_registry_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    validate-on-migrate: false

  security:
    debug: false

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  encryption:
    key: "TempleRegistryDevelopmentKey2024"
  storage:
    base-dir: ./uploads

logging:
  level:
    com.templeregistry: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
