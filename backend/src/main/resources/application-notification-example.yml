---
# Environment Variables Required
#
# Development:
# - SMTP_USERNAME (optional if email disabled)
# - SMTP_PASSWORD (optional if email disabled)
# - APP_BASE_URL (optional, defaults to localhost:5173)
#
# Production:
# - SMTP_HOST (required)
# - SMTP_PORT (required)
# - SMTP_USERNAME (required)
# - SMTP_PASSWORD (required)
# - SMTP_FROM (required)
# - APP_BASE_URL (required)
#
# Example .env file:
# SMTP_HOST=smtp.gmail.com
# SMTP_PORT=587
# SMTP_USERNAME=noreply@templeregistry.gov.in
# SMTP_PASSWORD=your-app-password
# SMTP_FROM=noreply@templeregistry.gov.in
# APP_BASE_URL=https://templeregistry.gov.in
